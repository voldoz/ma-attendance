<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="الحضور والغياب">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام الحضور والغياب — المعهد العالي للفنون الموسيقية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F5F8;--card:#FFF;--ink:#16202E;--quiet:#5E6A7A;--line:#E3E8EF;--line2:#CDD5E0;--accent:#1F4E9A;--accentInk:#FFF;--ok:#1E8A50;--bad:#C22F25;--warn:#A85F00;--info:#24539F;--med:#6B3FA0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:3px solid #6FA0E8;outline-offset:2px}
h1{font-size:20px;margin:0;line-height:1.35}h2{font-size:16px;margin:0}h3{font-size:15px;margin:0}
p{margin:0 0 10px}
small{font-size:12.5px}
.block{display:block}.quiet{color:var(--quiet)}.grow{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.center{text-align:center}
.shell{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:86px;position:relative}
.shell.wide{max-width:1180px}
.pad{padding:14px 16px}
.pad.center{padding:40px 24px}
.topbar{position:sticky;top:0;z-index:5;background:#FFF;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:60px}
.topbar .tt{flex:1;min-width:0}.topbar h1{font-size:17px}.topbar span{display:block;font-size:12.5px;color:var(--quiet);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border:none;background:none;border-radius:10px;display:grid;place-items:center;color:var(--ink);flex:none}
.iconbtn:hover{background:#EEF2F7}.iconbtn.danger{color:var(--bad)}
.avatar{width:44px;height:44px;border-radius:50%;border:none;background:#E4ECF8;color:var(--accent);font-weight:700;font-size:17px;display:grid;place-items:center;flex:none;position:relative}
.avatar.glass{background:rgba(255,255,255,.16);color:#FFF}
.badge{position:absolute;top:9px;left:10px;width:9px;height:9px;border-radius:50%;background:#FF6B5E;border:2px solid #1F4E9A}
.hero{background:linear-gradient(160deg,#1F4E9A,#163B78);color:#FFF;padding:18px 16px 20px;border-radius:0 0 22px 22px}
.hero p{color:#C9D8F2;margin:0;font-size:13px}.hero h1{font-size:20px;color:#FFF}
.kpis2,.kpis3,.kpis4{display:grid;gap:8px;margin-top:14px}
.kpis2{grid-template-columns:1fr 1fr}.kpis3{grid-template-columns:repeat(3,1fr)}.kpis4{grid-template-columns:repeat(2,1fr);margin:0 0 12px}
.kpis2>div,.kpis3>div{background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px}
.kpis2 span,.kpis3 span,.kpis4 span{display:block;font-size:12px;opacity:.9}.kpis2 b,.kpis3 b,.kpis4 b{font-size:24px;line-height:1.3}
.kpis3.light>div,.kpis4>div{background:#FFF;border:1px solid var(--line);color:var(--ink)}.kpis3.light span,.kpis4 span{color:var(--quiet)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:block;width:100%;text-align:start}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}.card.selw{border-color:#E8B860}
.card.empty{color:var(--quiet);text-align:center;padding:26px}
.card b{display:block}.card small{display:block;color:var(--quiet)}
.row b,.row small{display:block}
button.card{font:inherit;color:inherit}
.rowbtn{background:none;border:none;padding:0;width:100%;text-align:start;font:inherit;color:inherit}
.card.rowbtn{background:#FFF;border:1px solid var(--line);padding:14px}
.lesson{display:flex;align-items:center;gap:12px}.lesson.open{border:2px solid var(--accent)}.lesson.dim{opacity:.75}
.pnum{width:52px;height:52px;border-radius:12px;background:#EEF3FB;display:grid;place-items:center;text-align:center;flex:none;line-height:1.1}
.pnum small{font-size:10px;color:var(--quiet)}.pnum b{font-size:20px;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;flex:none}
.p-ok{background:#E3F4EA;color:#1A6E42}.p-bad{background:#FCE6E4;color:#A8261D}.p-warn{background:#FFF1D9;color:#8A4D00}.p-info{background:#E4ECF8;color:#1F4E9A}.p-med{background:#EFE7F8;color:#5A3290}.p-mute{background:#EDF0F4;color:#5E6A7A}
.btn{min-height:44px;padding:0 16px;border-radius:11px;border:none;background:var(--accent);color:var(--accentInk);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.big{width:100%;min-height:50px;font-size:16px}.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:9px}
.btn.ghost{background:#FFF;border:1px solid var(--line2);color:var(--ink);font-weight:600}
.btn.danger{background:#FCE6E4;color:#A8261D}.btn.okbtn{background:var(--ok);color:#FFF}.btn.warnbtn{background:#FFF1D9;color:#8A4D00}
.link{background:none;border:none;color:var(--accent);font-weight:700;padding:10px 0;min-height:44px}.link.quiet{color:var(--quiet);font-weight:500}
.note{border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-bottom:10px;display:flex;gap:6px;align-items:center}
.note.bad{background:#FCE6E4;color:#8E1F17}.note.warn{background:#FFF1D9;color:#7A4600}.note.info{background:#E4ECF8;color:#1C437F}.note.ok{background:#E3F4EA;color:#17603A}.note.med{background:#EFE7F8;color:#4F2B80}.note.mute{background:#EDF0F4;color:#4A5565;font-weight:500}
button.note{border:none;width:100%;text-align:start}
.hint{font-size:12.5px;color:var(--quiet);margin:10px 2px}
.sec{margin:18px 0 10px}
.seg{display:flex;background:#E7EBF1;border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;border:none;background:none;border-radius:9px;min-height:38px;font-weight:600;color:var(--quiet);padding:0 10px;white-space:nowrap;font-size:13.5px}
.seg button.on{background:#FFF;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{margin-bottom:12px}.field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
.field input,.field select,.field textarea,.inp{width:100%;min-height:46px;border:1px solid var(--line2);border-radius:11px;padding:8px 12px;background:#FFF}
.inp{width:auto;min-height:40px}.inp.full{width:100%}
textarea{resize:vertical}
.phone{display:flex;border:1px solid var(--line2);border-radius:11px;overflow:hidden;background:#FFF}
.phone span{padding:0 12px;display:grid;place-items:center;background:#F3F5F8;color:var(--quiet);font-weight:600;border-right:1px solid var(--line2)}
.phone input{border:none!important;flex:1;min-height:46px;padding:0 12px;outline:none}
.codebox{min-height:46px;border:1px dashed var(--line2);border-radius:11px;padding:10px 12px;font-weight:700;color:var(--accent);background:#F7F9FC;text-align:start}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#FFF;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;max-width:120px;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;color:#7C8796;font-size:11.5px;font-weight:600;min-height:60px}
.bnav button.on{color:var(--accent)}
.toast{position:fixed;bottom:124px;left:50%;transform:translateX(-50%);background:#16202E;color:#FFF;padding:11px 16px;border-radius:12px;font-weight:600;font-size:13.5px;z-index:20;max-width:min(92vw,460px);text-align:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
.fab{position:fixed;bottom:76px;left:10px;z-index:30;border:1px dashed #C79A3A;background:#FFF8E8;color:#7A4C00;border-radius:999px;padding:6px 12px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;min-height:36px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.overlay{position:fixed;inset:0;background:rgba(15,22,34,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#FFF;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 24px;animation:sup .22s}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px;max-width:860px}}
@keyframes sup{from{transform:translateY(30px);opacity:0}}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.divider{height:1px;background:var(--line);margin:12px 0}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.counts div{border-radius:11px;padding:8px 4px;text-align:center}.counts b{display:block;font-size:20px;line-height:1.2}.counts span{font-size:11.5px;font-weight:600}
.c-ok{background:#E3F4EA;color:#1A6E42}.c-bad{background:#FCE6E4;color:#A8261D}.c-warn{background:#FFF1D9;color:#8A4D00}.c-info{background:#E4ECF8;color:#1F4E9A}
.strow{display:flex;align-items:center;gap:10px;width:100%;background:#FFF;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:7px;text-align:start;min-height:56px}
.strow>small{color:var(--quiet);width:18px}.strow.changed{border-color:#E8B860;background:#FFFBF2}
.av{width:38px;height:38px;border-radius:50%;background:#E4ECF8;color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.av.sm{width:32px;height:32px;font-size:13px}
.savebar{position:sticky;bottom:0;background:#FFF;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bigicon{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px}.bigicon.bad{background:#FCE6E4;color:var(--bad)}
.notif{display:flex;gap:12px;align-items:flex-start}
.ni{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}.n-info{background:#E4ECF8;color:#1F4E9A}.n-warn{background:#FFF1D9;color:#8A4D00}.n-ok{background:#E3F4EA;color:#1A6E42}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.quick button{background:#FFF;border:1px solid var(--line);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:12.5px;color:var(--accent);min-height:72px}
.bar{height:8px;background:#EDF0F4;border-radius:99px;overflow:hidden;margin:8px 0 6px}.bar i{display:block;height:100%;border-radius:99px}
.medcard{border-color:#D8C7EE;background:#FBF8FF}
.pickrow{display:flex;gap:10px;align-items:center;width:100%;background:#FFF;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;text-align:start}
.pickrow.on{border-color:var(--accent);background:#F4F8FE}
.cbox{width:22px;height:22px;border-radius:6px;border:2px solid var(--line2);display:grid;place-items:center;flex:none}.pickrow.on .cbox{background:var(--accent);border-color:var(--accent)}
.upload{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed #B9C9E2;border-radius:14px;padding:20px;background:#F7FAFE;margin:8px 0 12px;cursor:pointer;position:relative;color:var(--accent)}
.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}
.filechip{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;background:#FAFBFD;width:100%;text-align:start}
.pdf{width:42px;height:48px;border-radius:8px;background:#FCE6E4;color:#A8261D;font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
.subbox{background:#F7F9FC;border-radius:10px;padding:8px 10px;margin-top:10px;font-size:13px}.subbox .row{padding:3px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line2);background:#FFF;border-radius:999px;padding:6px 12px;min-height:36px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#FFF}
.tag{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 6px 4px 12px;font-size:13px;font-weight:600}
.tag button{border:none;background:none;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;color:inherit}
.t-med{background:#EFE7F8;color:#5A3290}.t-info{background:#E4ECF8;color:#1F4E9A}
.grid2b{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rights{background:#F4F8FE;border-color:#D3E0F4}.rights span{display:block;font-size:13px;color:#2B3B52;margin-top:3px}
.timeline{border-right:2px solid #D3DCE8;margin:8px 6px 0 0;padding-right:12px}
.timeline>div{position:relative;padding:3px 0}.timeline i{position:absolute;right:-18px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.timeline b{font-size:13px;font-weight:600}.timeline small{font-size:11.5px}
.stamp{border:2px solid var(--ok);border-radius:12px;padding:8px 12px;margin-top:10px;color:#17603A;background:#F2FBF5;transform:rotate(-1deg);font-size:13px}
.stamp b{display:inline-flex!important;align-items:center;gap:4px}.stamp span{display:block}
.mini{background:#F7F9FC;border-radius:10px;padding:8px 10px}.mini b{font-size:18px}
.dicon{width:42px;height:42px;border-radius:12px;background:#E4ECF8;color:var(--accent);display:grid;place-items:center;flex:none}
.lbl{display:block;font-weight:700;color:var(--quiet);margin:10px 0 6px;font-size:12px}
.headrow{display:flex;gap:8px;align-items:center;background:#F4F8FE;border-radius:10px;padding:10px;color:var(--accent)}.headrow b{color:var(--ink)}
.trow{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.addbox{background:#F7F9FC;border-radius:12px;padding:12px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.cls{margin:0}
.swrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;background:none;border:none;border-top:1px solid var(--line);padding:12px 0;text-align:start;min-height:56px}
.swrow small{display:block;color:var(--quiet)}
.sw{width:46px;height:28px;border-radius:99px;background:#CDD5E0;display:flex;padding:3px;justify-content:flex-start;flex:none}
.sw.on{background:var(--ok);justify-content:flex-end}.sw i{width:22px;height:22px;border-radius:50%;background:#FFF;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.rolegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rolegrid button{border:1px solid var(--line2);background:#FFF;border-radius:10px;min-height:40px;font-weight:600;font-size:13px}
.rolegrid button.on{background:var(--accent);color:#FFF;border-color:var(--accent)}
.savenote{font-size:12px;color:var(--quiet);text-align:center;margin-top:12px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
table.t th{background:#F3F5F8;font-weight:700;text-align:start;padding:8px 10px;color:var(--quiet);font-size:12.5px;white-space:nowrap}
table.t td{border-top:1px solid var(--line);padding:9px 10px;vertical-align:middle}
.tablebox{background:#FFF;border:1px solid var(--line);border-radius:14px;overflow:auto}.tablebox table.t{margin:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;vertical-align:middle;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--quiet);margin-top:8px;align-items:center}
.bars{display:flex;gap:12px;align-items:flex-end;height:160px;padding-top:10px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bars i{display:block;width:100%;max-width:46px;border-radius:6px 6px 0 0;min-height:2px}.bars span,.bars small{font-size:12px;color:var(--quiet)}
/* schedule grid */
.schedbox{overflow:auto;background:#FFF;border:1px solid var(--line);border-radius:14px}
.sched{display:grid;grid-template-columns:72px repeat(9,minmax(92px,1fr));min-width:900px;font-size:12px}
.sched>*{border-left:1px solid var(--line);border-bottom:1px solid var(--line);min-height:62px;padding:6px;text-align:center}
.sched .h{background:#F3F5F8;font-weight:700;min-height:44px;color:var(--quiet)}.sched .h small{display:block;font-weight:500;font-size:10.5px}
.sched .d{background:#F3F5F8;font-weight:700;display:flex;flex-direction:column;justify-content:center}.sched .d.today{background:#E4ECF8;color:var(--accent)}.sched .d small{font-size:10px}
.sched .brk{background:repeating-linear-gradient(45deg,#F5F7FA,#F5F7FA 6px,#EDF0F4 6px,#EDF0F4 12px)}
.sched .c{background:#FFF;border-top:none;border-right:none;font:inherit;font-size:12px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.sched button.c:hover{background:#F4F8FE}
.sched .c b{font-size:12.5px}.sched .c span{color:var(--quiet);font-size:11px;display:flex;align-items:center;justify-content:center}
.sched .c.g{background:#EEF4FC}.sched .c.s{background:#F5EFFC}
/* map */
.mapbox{position:relative;height:250px;border-radius:14px;overflow:hidden;background:#E9EEE6;margin-bottom:12px;display:grid;place-items:center}
.mapbox .road{position:absolute;background:#FFF}.r1{height:14px;left:0;right:0;top:60%}.r2{width:12px;top:0;bottom:0;left:30%}.r3{height:9px;left:0;right:0;top:22%;transform:rotate(-8deg)}
.mapbox .bld{position:absolute;width:70px;height:50px;background:#D5DAD0;border-radius:4px}
.mapbox .ring{position:absolute;border-radius:50%;background:rgba(31,78,154,.14);border:2px solid var(--accent)}
.mapbox .pinm{position:relative;margin-bottom:28px}.mapbox small{position:absolute;bottom:8px;right:10px;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:6px;color:var(--quiet)}
.pdfview{background:#FFF;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.07);aspect-ratio:1/1.3;max-width:340px;margin:0 auto 8px;padding:26px 22px;display:flex;flex-direction:column;gap:9px}
.pdfview>i{display:block;height:7px;background:#E3E8EF;border-radius:4px}.pdfview .l1{height:14px;width:70%;background:#C9D3E2;margin:0 auto 6px}.pdfview .l2{width:40%;margin:0 auto 10px}
.pdfview .staff{margin-top:10px;display:flex;flex-direction:column;gap:6px}.pdfview .staff i{height:1px;background:#8A94A3}
/* login */
.login{min-height:100vh;display:flex;justify-content:center;padding:24px 16px;background:linear-gradient(180deg,#E9EFF8,#F3F5F8 40%)}
.lbox{width:100%;max-width:420px}
.lhead{text-align:center;margin:28px 0 22px}.lhead img{display:block;margin:0 auto 10px}.lhead h1{font-size:24px}.lhead p{color:var(--quiet)}
.lbox form{margin-top:16px}
.demo{margin-top:20px;background:#FFF;border:1px solid var(--line);border-radius:14px;padding:12px}
.demo b{display:block}.demo>small{display:block;color:var(--quiet);margin-bottom:6px}
.demo button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:none;border-top:1px solid var(--line);padding:10px 2px;min-height:46px;text-align:start;font-weight:600}
.demo button small{color:var(--accent)}
/* official forms */
.fitbox{width:100%;overflow:hidden;position:relative}
.formA4,.formA4l{transform-origin:top right;background:#FFF;color:#000;font-family:'Times New Roman','IBM Plex Sans Arabic',serif;box-shadow:0 2px 12px rgba(0,0,0,.1);position:absolute;top:0;right:0}
.formA4{width:794px;padding:34px 38px;font-size:15px}
.formA4l{width:1123px;padding:30px 34px;font-size:15px}

  A.bioSet = function (v) { if (me().role !== 'admin') return; S.settings.bio = !!v; commit(v ? 'صار تأكيد بصمة الوجه مطلوبًا لتسجيل الحضور.' : 'أُوقف تأكيد بصمة الوجه.'); };
  /* ---------- التحقق الفعلي من موقع المعلم عند تسجيل الغياب ---------- */

  const getPos = () => new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }));
  const _saveTake = A.saveTake; let geoBusy = false;

  };
  A.locRetry = function () { UI.loc = 'in'; render(); };
  /* ---------- ملفات المنهج: تخزين فعلي في Supabase Storage ---------- */

  };
  const _delFile = A.delFile;

  /* ---------- إشعارات الجوال ---------- */
  const PUSH = { reg: null, state: 'off' };
  const pushB64 = (s) => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const r = atob(s); return Uint8Array.from(r, (c) => c.charCodeAt(0)); };

  }
  { const st = document.createElement('style'); st.textContent = '.pushband{position:fixed;left:12px;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:35;background:#111;color:#fff;border:1px solid #C9A227;border-radius:14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font:600 13px/1.5 system-ui;box-shadow:0 6px 20px rgba(0,0,0,.3)}.pushband .pbb{display:flex;gap:6px;flex:none}.pushband button{border:0;border-radius:10px;padding:8px 12px;font:700 13px system-ui}.pushband .pb1{background:#C9A227;color:#000}.pushband .pb2{background:transparent;color:#ccc}'; document.head.appendChild(st); }
  async function pushAfterLogin() {

  A.pushOn = async function () {

    const h = _profile(); const i = h.indexOf('<button class="btn big"'); return i < 0 ? h + bioC + card : h.slice(0, i) + bioC + card + h.slice(i);
